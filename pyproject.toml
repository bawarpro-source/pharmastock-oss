[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmastock-oss"
version = "0.1.0"
description = "Open-source pharmacy inventory reconciliation tool using fictional sample data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Bawar Abdulrahman"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pharmastock = "pharmastock.cli:main"

[tool.setuptools.packages.find]
include = ["pharmastock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
